name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: deal_finder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d deal_finder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEAL_FINDER_TEST_DATABASE_URL: postgresql://test:disposable-ci-password@127.0.0.1:5432/deal_finder_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -c "from deal_finder.api import app; assert app.openapi()['info']['version'] == '0.3.0'"
      - run: pip wheel --no-deps . -w /tmp/deal-finder-wheel
      - run: python -c "import zipfile, glob; z=zipfile.ZipFile(glob.glob('/tmp/deal-finder-wheel/*.whl')[0]); assert all('deal_finder/migrations/' + p in z.namelist() for p in ['001_postgres.sql', '002_private_access.sql', '003_national_archive.sql', '004_market_screening.sql', '005_plate_lookup.sql', '006_price_memory.sql', '007_photo_archive.sql'])"
      - run: python -c "import zipfile, glob; z=zipfile.ZipFile(glob.glob('/tmp/deal-finder-wheel/*.whl')[0]); assert 'deal_finder/data/nearby_municipalities.json' in z.namelist()"
