[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-deal-finder"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "protego>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["deal_finder*"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["httpx>=0.27,<1"]

[project.scripts]
deal-finder = "deal_finder.worker:main"

[tool.setuptools.package-data]
deal_finder = ["migrations/*.sql", "data/*.json"]
